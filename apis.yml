name: t4game
description: >-
  t4game (呈天游 / Bstonegames) is the brand of Beijing Chengtian Network Technology
  Co., Ltd., a Chinese online-game developer and operator founded in 2008 and
  headquartered in Beijing. The company designs, publishes, and operates mobile,
  PC, and web-based games — including titles such as 醉江湖online (Drunk Rivers and
  Lakes Online) and 诛神传奇/诛神online (Zhushen Online) — spanning role-playing,
  real-time strategy, and shooting genres. Its public presence at t4game.com is a
  consumer-facing game portal (player login, registration, and recharge), company
  and culture pages, a product catalog, game/media news, and recruitment listings.
  It was added to the API Evangelist network as a portfolio company of the venture
  firm Qiming. As of this enrichment pass the company publishes no public developer
  program: no developer portal, API reference, OpenAPI/AsyncAPI specification, SDKs,
  CLI, MCP server, or other machine-readable API surface could be found.
